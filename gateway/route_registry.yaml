# gateway/route_registry.yaml
#
# The answer to "where does this endpoint live." Generated into the gateway's
# routing config AND rendered as a human-readable table in the repo README,
# so it never drifts from what's actually deployed.
#
# Rule: if you add an endpoint, add a row here in the same PR. CI
# (.github/workflows/contract-tests.yml) fails the build if a service exposes
# a path not listed here — see Skeleton-Prompt.md §2.
routes:
  - path: /config/{scope}/{key}
    method: GET
    owner: suchit
    service: backend
    kind: sync-api
    contract: contracts/openapi/config-service.suchit.yaml
    callers: [shree, shruthi, tharun]
    permission: service_read_no_personal_data
    note: "unauthenticated service read (no personal data); follow-up P1 service identity"
    masking: none  # config values carry no personal data

  - path: /config/{scope}/{key}
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: config.write
    note: "P5-02b — FR-CFG-01/03 write path. Not in the frozen config-service.suchit.yaml (GET-only contract); administrator-only (Permission.CONFIG_WRITE)."
    masking: none  # config values carry no personal data

  - path: /models/{module}/active
    method: GET
    owner: tharun
    service: modelwork
    kind: sync-api
    contract: contracts/openapi/model-registry.tharun.yaml
    callers: [suchit, shree]
    permission: service_read_no_personal_data
    masking: none  # model registry metadata carries no personal data

  - path: /closed-sets/{type}
    method: GET
    owner: [suchit, shruthi]
    service: backend
    kind: sync-api
    contract: contracts/openapi/closed-sets.suchit-shruthi.yaml
    callers: [shree]
    permission: service_read_no_personal_data
    note: "never exposes LRMS-derived sets — schema/LGD only, FR-VAL-09; unauthenticated service read (no personal data); follow-up P1 service identity"
    masking: none  # LGD/schema closed sets only, never a record field

  - path: /documents
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: document.ingest
    note: "ingest entrypoint (M1) — client uploads land here, gets a job id back, never blocks. Live as of Phase 2 (P2-01/02/04/05); see PHASE2.md."
    masking: none  # returns a job/document id, never field data

  - path: /review-tasks
    method: GET
    owner: suchit
    service: backend
    kind: rest
    permission: review.claim
    note: "reasons rendered come from shruthi (rule failures) and tharun (calibrator features) — backend must render both identically, FR-REV-11"
    masking: none  # ReviewTaskPublicView carries no field value/raw_value — see backend.api.serializers

  - path: /review-tasks/next
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: review.claim
    note: "keyboard-first fetch-next, FOR UPDATE SKIP LOCKED claim — P3-03, FR-REV-01/02"
    masking: none  # same shape as GET /review-tasks

  - path: /review-tasks/{task_id}/crop
    method: GET
    owner: suchit
    service: backend
    kind: rest
    permission: review.claim
    note: "signed, short-TTL crop URL — P3-04, FR-REV-01/FR-SEC-08"
    masking: officer_working_view_out_of_scope
    masking_note: >
      P4-10's masking guarantee targets PUBLISHED record reads
      (/records/*, provenance, unmasked-read) — the surfaces ADR-007/
      FR-SEC-02 are written against. This pre-existing (Phase 3) route is
      an officer's *working* view of a field they are actively reviewing
      or correcting, which structurally requires seeing the value —
      masking it would make the review workflow itself impossible. Named
      here as a deliberate, declared exemption (see PHASE4.md's "T4.c
      scope" section) rather than an undeclared gap — every route in this
      file still carries an explicit `masking:` value, which is what
      T4.c's enumeration actually checks.

  - path: /review-tasks/{task_id}/submit
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: review.submit
    note: "writes Correction (or PendingCorrection on maker-checker) + AuditSample verdict — P3-05/07/08/09"
    masking: officer_working_view_out_of_scope  # same reasoning as the crop route directly above

  - path: /review-tasks/{task_id}/skip
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: review.submit
    note: "releases the claim back to the pool — P3-03"
    masking: none  # no field data in the response

  - path: /review-tasks/pending-corrections/{pending_id}/confirm
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: review.confirm
    note: "T1-01 / FR-REV-12 maker-checker confirmation route — verifier, supervisor only"
    masking: none

  - path: /conflicts
    method: GET
    owner: suchit
    service: backend
    kind: rest
    permission: conflict.read
    masking: none  # ConflictPublicView carries record ids/rule/evidence, no field value

  - path: /conflicts/{conflict_id}
    method: GET
    owner: suchit
    service: backend
    kind: rest
    permission: conflict.read
    masking: none

  - path: /conflicts/{conflict_id}/assign
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: conflict.assign
    note: "P3-10, FR-CFL-04"
    masking: none

  - path: /conflicts/{conflict_id}/transition
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: conflict.transition
    note: "P3-10/12, FR-CFL-04/05 — resolution + author recorded in the audit trail on resolve"
    masking: none

  - path: /dashboard/metrics
    method: GET
    owner: suchit
    service: backend
    kind: rest
    permission: dashboard.read
    note: "figures derived only from audit log — no second source of truth, FR-ANL-01/07"
    masking: none  # aggregate counts only, never a per-record field value

  - path: /records/publish
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: record.publish
    masking: none
    note: "P4-01, FR-PUB-01 — always an append (new Record version), gated by publication_gate.attempt_publish; never returns field data itself"

  - path: /records/{record_group_id}
    method: GET
    owner: suchit
    service: backend
    kind: rest
    permission: record.read.masked
    masking: masked_record_view
    note: "P4-10, FR-SEC-02 — the ONLY shape a record's fields leave this process in (MaskedRecordView, one serializer path)"

  - path: /extractions/{extraction_id}/provenance
    method: GET
    owner: suchit
    service: backend
    kind: rest
    permission: provenance.read
    masking: none
    note: "P4-02, FR-PUB-02 — provenance identity/transforms/edit-history only; carries no current field VALUE, so nothing here needs masking (raw_value/predicted/corrected live behind /records and the unmasked-read route, both masked)"

  - path: /extractions/{extraction_id}/unmasked-read
    method: POST
    owner: suchit
    service: backend
    kind: rest
    permission: record.read.unmasked
    masking: unmasked_privileged_operation
    note: "P4-08, FR-SEC-08 — distinct endpoint/permission/audit-action from the masked read; mandatory non-empty purpose string; role.auditor only"

  - path: /chain/verify
    method: GET
    owner: suchit
    service: backend
    kind: rest
    permission: chain.verify
    masking: none
    note: "P4-06 — convenience in-app view; the audited guarantee is the standalone verify-chain CLI against an externally-anchored root, see PHASE4.md"
