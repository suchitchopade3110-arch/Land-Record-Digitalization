# TODO: keep in sync with route_registry.yaml — routes by path prefix to the
# owning service. This is for external/client access and cross-team calls;
# direct service ports (infra/docker-compose.yml) stay open on the local
# docker network for fast iteration (same route registry, two doors).
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream extraction {
        server extraction:8000;
    }

    upstream validation {
        server validation:8000;
    }

    upstream modelwork {
        server modelwork:8000;
    }

    server {
        listen 80;

        # Suchit — API, Storage, Queue, M1/M2-routing/M9-M10-M12-M15
        location /documents {
            proxy_pass http://backend;
        }

        location /review-tasks {
            proxy_pass http://backend;
        }

        location /conflicts {
            proxy_pass http://backend;
        }

        location /dashboard/ {
            proxy_pass http://backend;
        }

        location /config/ {
            proxy_pass http://backend;
        }

        location /closed-sets/ {
            proxy_pass http://backend;
        }

        # Tharun — model registry
        location /models/ {
            proxy_pass http://modelwork;
        }

        # Direct /docs passthroughs for local dev convenience, per-service.
        location /docs/backend/ {
            proxy_pass http://backend/docs;
        }

        location /docs/extraction/ {
            proxy_pass http://extraction/docs;
        }

        location /docs/validation/ {
            proxy_pass http://validation/docs;
        }

        location /docs/modelwork/ {
            proxy_pass http://modelwork/docs;
        }
    }
}
