[project]
name = "backend"
version = "0.1.0"
description = "Suchit — API layer, Storage, Queue infra, M1/M2-routing/M9/M10/M12-M15."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9", # FR-ING-01 — multipart file upload on POST /documents
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "observability",
  "landqueue",
  "landstorage",
  "landoutbox",
  "landenvelope",
  "landmasking",
  "landaudit",
  "landconfigclient",
  "pypdf>=4.0",   # FR-ING-03 — PDF page-tree splitting (structural, not OCR)
  "pillow>=10.0", # FR-ING-03/FR-TRI-06 — multi-frame TIFF splitting + off-the-shelf preprocessing ops
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
