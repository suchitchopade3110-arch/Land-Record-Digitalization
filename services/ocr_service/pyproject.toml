[project]
name = "ocr_service"
version = "0.1.0"
description = "Dedicated Baidu Unlimited-OCR Inference Service (M3 GPU/VLM Sidecar)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "pillow>=10.2.0",
  "numpy>=1.26.0",
  "torch>=2.2.0; sys_platform != 'win32' or python_version < '3.13'",
  "torchvision>=0.17.0",
  "transformers>=4.40.0",
  "einops>=0.7.0",
  "easydict>=1.13",
  "addict>=2.4.0",
  "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
