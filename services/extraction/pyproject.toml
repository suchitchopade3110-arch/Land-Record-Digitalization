[project]
name = "extraction"
version = "0.1.0"
description = "Shree — OCR + Map/GIS, M3 (text lane) and M4 (map lane)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "shapely>=2.0",
  "observability",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
