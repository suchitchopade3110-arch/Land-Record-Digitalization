[alembic]
script_location = .
# Overridden by env.py from $DATABASE_URL when set (Makefile always sets
# it). This default matches infra/docker-compose.yml's postgres service
# credentials (POSTGRES_PASSWORD=dev, default POSTGRES_USER=postgres) as
# seen from the host — i.e. `docker compose up` + no override just works.
sqlalchemy.url = postgresql+psycopg://postgres:dev@localhost:5432/landrecords

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
