# Local dev: postgres+postgis, object storage, queue, all 4 services, gateway.
#
# [DESIGN CHOICE] Message broker: Redis Streams — the lightest option for a
# 4-person P0 build (consumer groups give at-least-once + per-worker offsets
# for free, and it's one more container the team already needs for caching).
# Kafka/RabbitMQ are fine alternatives if someone has stronger ops experience
# with one already — this was picked in week one per Skeleton-Prompt.md §4,
# so it isn't re-litigated mid-build.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: landrecords
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # P4-05/FR-PUB-08 — the second store the audit chain's global root is
  # anchored to. A GENUINELY SEPARATE service (its own container, its own
  # root credential — `ANCHOR_STORE_ROOT_USER`/`ANCHOR_STORE_ROOT_PASSWORD`
  # below are never derived from `minio`'s `MINIO_ROOT_*` above, the same
  # "never derived from" posture P2-06's SECONDARY_OBJECT_STORE_* already
  # established for the fixity-sweep's second copy). `backend`'s own
  # environment below is deliberately given a *different*, narrower
  # credential (`ANCHOR_STORE_ACCESS_KEY_ID`/`ANCHOR_STORE_SECRET_ACCESS_KEY`,
  # a bucket-scoped MinIO user this compose file provisions with a
  # write-only ("PutObject", no "GetObject"/"ListBucket") policy) — see
  # PHASE4.md's "P0 form of the second store" section for exactly what
  # this sandboxed environment could and could not verify about that
  # policy actually being enforced (no docker daemon was available to
  # bring this compose file up and test it end to end in this session).
  anchor_store:
    image: minio/minio
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: anchor-root-admin
      MINIO_ROOT_PASSWORD: anchor-root-admin-password-CHANGE-ME
    ports: ["9010:9000", "9011:9002"]
    volumes:
      - anchor_store_data:/data

  backend:
    build: ../services/backend
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/landrecords
      OBJECT_STORE_URL: http://minio:9000
      QUEUE_URL: redis://redis:6379
      # FR-ING-07 (P2-06): the secondary object-store namespace is
      # deliberately never derived from OBJECT_STORE_* above — a
      # genuinely separate root, verified distinct at startup
      # (landstorage.distinct.assert_distinct_stores). A real deployment
      # points this at a second bucket under separate credentials; local
      # dev uses a second local_fs root, which is still enough to prove
      # "a single compromised key can't rewrite both copies" doesn't hold
      # for the *same* filesystem-permission boundary, and is honest about
      # that limit rather than pretending two directories are two
      # credential sets.
      SECONDARY_OBJECT_STORE_ROOT: /data/secondary-objects
      DROP_FOLDER_PATH: /data/drop-folder  # P2-01 — the watched-folder ingest entrypoint
      # P4-05/FR-PUB-08 — the anchor store's own, third, independent
      # credential namespace. `ANCHOR_STORE_ACCESS_KEY_ID`/`_SECRET_ACCESS_KEY`
      # below are a SEPARATE, narrower-scoped MinIO user this backend
      # container holds — NOT `anchor_store`'s `MINIO_ROOT_*` above, which
      # only an operator provisioning the bucket/policy ever uses. This
      # application container must never hold the anchor store's root
      # credential; provisioning the scoped user + its write-only policy
      # is an operator/deploy-time step (`mc admin policy` / MinIO IAM),
      # not something `backend`'s own code does at runtime — the intent
      # here is "the app container's env only ever HOLDS the narrow
      # credential," which this compose file expresses even though this
      # sandbox could not run it to confirm the policy is actually
      # enforced server-side (see PHASE4.md).
      ANCHOR_STORE_DRIVER: s3
      ANCHOR_STORE_URL: http://anchor_store:9000
      ANCHOR_STORE_BUCKET: audit-anchors
      ANCHOR_STORE_ACCESS_KEY_ID: backend-anchor-writer
      ANCHOR_STORE_SECRET_ACCESS_KEY: backend-anchor-writer-password-CHANGE-ME
      ANCHOR_KMS_KEY_SEED: dev-only-anchor-kms-seed-CHANGE-ME  # P0 KMS sign-only stub seed — see landaudit.kms
      AUDIT_HMAC_KEY: dev-only-audit-hmac-key-CHANGE-ME  # P4-07 — see PHASE4.md's HMAC key custody section for who else may/may not hold this
    volumes:
      - backend_data:/data
    depends_on: [postgres, minio, redis, anchor_store]
    ports: ["8001:8000"]

  backend-ingestion:
    build: ../services/backend
    command: python -m backend.workers.run ingestion
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/landrecords
      OBJECT_STORE_URL: http://minio:9000
      QUEUE_URL: redis://redis:6379
      SECONDARY_OBJECT_STORE_ROOT: /data/secondary-objects
      DROP_FOLDER_PATH: /data/drop-folder
      ANCHOR_STORE_DRIVER: s3
      ANCHOR_STORE_URL: http://anchor_store:9000
      ANCHOR_STORE_BUCKET: audit-anchors
      ANCHOR_STORE_ACCESS_KEY_ID: backend-anchor-writer
      ANCHOR_STORE_SECRET_ACCESS_KEY: backend-anchor-writer-password-CHANGE-ME
      ANCHOR_KMS_KEY_SEED: dev-only-anchor-kms-seed-CHANGE-ME
      AUDIT_HMAC_KEY: dev-only-audit-hmac-key-CHANGE-ME
    volumes:
      - backend_data:/data
    depends_on: [postgres, minio, redis, anchor_store]

  backend-triage:
    build: ../services/backend
    command: python -m backend.workers.run triage
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/landrecords
      OBJECT_STORE_URL: http://minio:9000
      QUEUE_URL: redis://redis:6379
      SECONDARY_OBJECT_STORE_ROOT: /data/secondary-objects
      DROP_FOLDER_PATH: /data/drop-folder
      ANCHOR_STORE_DRIVER: s3
      ANCHOR_STORE_URL: http://anchor_store:9000
      ANCHOR_STORE_BUCKET: audit-anchors
      ANCHOR_STORE_ACCESS_KEY_ID: backend-anchor-writer
      ANCHOR_STORE_SECRET_ACCESS_KEY: backend-anchor-writer-password-CHANGE-ME
      ANCHOR_KMS_KEY_SEED: dev-only-anchor-kms-seed-CHANGE-ME
      AUDIT_HMAC_KEY: dev-only-audit-hmac-key-CHANGE-ME
    volumes:
      - backend_data:/data
    depends_on: [postgres, minio, redis, anchor_store]

  backend-decision:
    build: ../services/backend
    command: python -m backend.workers.run decision
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/landrecords
      OBJECT_STORE_URL: http://minio:9000
      QUEUE_URL: redis://redis:6379
      SECONDARY_OBJECT_STORE_ROOT: /data/secondary-objects
      DROP_FOLDER_PATH: /data/drop-folder
      ANCHOR_STORE_DRIVER: s3
      ANCHOR_STORE_URL: http://anchor_store:9000
      ANCHOR_STORE_BUCKET: audit-anchors
      ANCHOR_STORE_ACCESS_KEY_ID: backend-anchor-writer
      ANCHOR_STORE_SECRET_ACCESS_KEY: backend-anchor-writer-password-CHANGE-ME
      ANCHOR_KMS_KEY_SEED: dev-only-anchor-kms-seed-CHANGE-ME
      AUDIT_HMAC_KEY: dev-only-audit-hmac-key-CHANGE-ME
    volumes:
      - backend_data:/data
    depends_on: [postgres, minio, redis, anchor_store]

  backend-outbox-relay:
    build: ../services/backend
    command: python -m backend.workers.run outbox-relay
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/landrecords
      QUEUE_URL: redis://redis:6379
    depends_on: [postgres, redis]

  extraction:
    build: ../services/extraction
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/landrecords
      OBJECT_STORE_URL: http://minio:9000
      QUEUE_URL: redis://redis:6379
      BACKEND_URL: http://backend:8000
    depends_on: [postgres, minio, redis, backend]
    ports: ["8002:8000"]

  validation:
    build: ../services/validation
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/landrecords
      QUEUE_URL: redis://redis:6379
      BACKEND_URL: http://backend:8000
    depends_on: [postgres, redis, backend]
    ports: ["8003:8000"]

  modelwork:
    build: ../services/modelwork
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/landrecords
      QUEUE_URL: redis://redis:6379
      BACKEND_URL: http://backend:8000
    depends_on: [postgres, redis, backend]
    ports: ["8004:8000"]

  gateway:
    image: nginx:alpine
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend, extraction, validation, modelwork]
    ports: ["8000:80"]

volumes:
  postgres_data:
  minio_data:
  anchor_store_data:
  backend_data:
