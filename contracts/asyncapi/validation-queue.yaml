# TODO: FR-VAL-01-09. Producer: Shree (via normalization fan-out). Consumer: Shruthi (six
# validators). Payload: canonical Extraction[]. Downstream: ValidationResult[] flow into
# CONFIDENCE_NOVELTY_QUEUE. See API-Contracts §5, Architecture §13.
asyncapi: 2.6.0
info:
  title: Validation Queue
  version: "0.1.0"
channels:
  VALIDATION_QUEUE:
    subscribe:
      summary: Consumed by Shruthi's six validators (syntactic, arithmetic, referential, lineage, geospatial, legacy_reconciliation).
      message:
        $ref: '#/components/messages/ValidationEnvelope'
    publish:
      summary: Published by Shree's normalize step (fan-out sibling of ENTITY_RES_QUEUE).
      message:
        $ref: '#/components/messages/ValidationEnvelope'
components:
  messages:
    ValidationEnvelope:
      name: ValidationEnvelope
      payload:
        type: object
        required: [message_id, trace_id, emitted_at, producer, work_envelope, payload]
        properties:
          message_id: { type: string, format: uuid }
          trace_id: { type: string }
          emitted_at: { type: string, format: date-time }
          producer: { type: string, enum: [normalize] }
          work_envelope: { type: object, $ref: '../schemas/work_envelope.schema.json' }
          payload:
            type: array
            items:
              $ref: '../schemas/extraction.schema.json'
