[project]
name = "observability"
version = "0.1.0"
description = "Shared tracing/logging lib — every service imports this so trace_id propagation (API-Contracts §1) is automatic, not reimplemented four times slightly differently."
requires-python = ">=3.11"
dependencies = ["structlog>=24.1", "jsonschema>=4.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
