[project]
name = "landoutbox"
version = "0.1.0"
description = "ADR-005 — transactional outbox. The DB write and the queue emit commit as one Postgres transaction; a relay drains to the broker."
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "landqueue"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
